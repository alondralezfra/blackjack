<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blackjack</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <body>
        <header>
            <h1>Blackjack</h1>
            <img src="blackjackLogo.webp" alt="Blackjack Logo" style="width:75px;height:75px;">
        </header>

        <main>
            <section id="loginSection">
                <h2>Login to Your Account</h2>
                <form id="loginForm">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>

                    <button type="submit">Login</button>

                    <p>Don't have an account? <a href="register.html">Register here</a></p> <!-- Link to registration page -->
                </form>
                <p hidden id="errorMessage">Incorrect Password or Username!</p> <!-- Placeholder for error messages -->
            </section>
        </main>

        <footer>
            <nav> <!-- navigation links -->
                <ul> <!-- unordered list -->
                    <li><a href="index.html">About Blackjack</a></li> <!-- list item -->

            </nav>

        </footer>
