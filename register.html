<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="reset.css">
        <link rel="stylesheet" href="common.css">
        <link rel="stylesheet" href="register.css"> <!-- Updated CSS file for register page -->
    </head>

    <body>
        <header>
            <h1>Blackjack</h1>
            <img src="blackjackLogo.webp" alt="Blackjack Logo" style="width:75px;height:75px;">
        </header>

        <main>
            <section id="registerSection">
                <h2>Create Your Account</h2>
                <form id="registerForm">
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div>
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div>
                        <label for="dateOfBirth">Date of Birth:</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                    </div>
                    <div>
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" required>
                    </div>
                    <div>
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <div>
                        <label for="terms">I agree to the terms and conditions</label>
                        <input type="checkbox" id="terms" name="terms" required>
                    </div>
                    <div>
                        <label for="privacy">I agree to the privacy policy</label>
                        <input type="checkbox" id="legal" name="privacy" required>
                    </div>
                    <button type="submit">Register</button>

                    <p>Already have an account? <a href="login.html">Login here</a></p> <!-- Link to login page -->
                </form>
                <p hidden id="errorMessage">Registration failed. Please try again.</p> <!-- Placeholder for error messages -->
            </section>
        </main>

        <footer>
            <nav> <!-- navigation links -->
                <ul> <!-- unordered list -->
                    <li><a href="index.html">About Blackjack</a></li> <!-- list item -->
                    <li><a href="rules.html">Blackjack Rules</a></li> <!-- list item -->
                    <li><a href="table.html">Gaming Table</a></li>
                </ul>
            </nav>
            <p id="copyright">&copy; 2025 Blackjack Inc. All rights reserved.</p>
        </footer>

        <script src="register.js"></script> <!-- Link to the JavaScript file for registration functionality -->
